<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--oss-head-->
    <style>html{background:#0a0a0a;color-scheme:dark}</style>

    <title>OneSimpleSite | Fixed-Price Websites for UK Local Businesses</title>
    <meta name="keywords" content="web design UK, local business website, small business website, affordable website design, plumber website, electrician website, tradesman website, UK web design, professional website, local SEO" />
    <meta name="author" content="OneSimpleSite" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#3BA875" />
    <meta name="msapplication-TileColor" content="#3BA875" />



    <!-- Geo Tags -->
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="United Kingdom" />

    <!-- JSON-LD Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OneSimpleSite",
      "alternateName": "One Simple Site",
      "url": "https://onesimplesite.co.uk",
      "logo": "https://onesimplesite.co.uk/favicon.svg",
      "description": "OneSimpleSite provides web design and development for businesses across the UK. Fixed-price websites with local SEO foundations.",
      "email": "hello@onesimplesite.co.uk",
      "areaServed": {
        "@type": "Country",
        "name": "United Kingdom"
      },
      "sameAs": ["https://www.instagram.com/onesimplesite/", "https://www.facebook.com/profile.php?id=61587530671229", "https://www.tiktok.com/@onesimplesite", "https://www.linkedin.com/company/onesimplesite/"]
    }
    </script>

    <!-- JSON-LD Structured Data - LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "OneSimpleSite",
      "description": "Professional website design and development services for local UK businesses including plumbers, electricians, mechanics, cleaners, and tradespeople.",
      "url": "https://onesimplesite.co.uk",
      "logo": "https://onesimplesite.co.uk/favicon.svg",
      "image": "https://onesimplesite.co.uk/og-image.png",
      "email": "hello@onesimplesite.co.uk",
      "priceRange": "£189-£489",
      "areaServed": {
        "@type": "Country",
        "name": "United Kingdom"
      },
      "serviceType": ["Web Design", "Web Development", "Local SEO", "Website Hosting"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Website Packages",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Launch",
              "description": "Up to 3 main website pages with design, mobile-friendly layouts, copywriting, an enquiry form, essential SEO and 1 revision round"
            },
            "price": "189",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Growth",
              "description": "Up to 10 main website pages with content planning, advanced on-page SEO, business email setup, basic analytics setup and 3 revision rounds"
            },
            "price": "489",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Enterprise",
              "description": "Online shops, customer portals, integrations and bespoke projects, with a tailored quotation"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Hosting & Care",
              "description": "Monthly hosting, SSL, backups, security monitoring and small content changes, cancellable with 30 days' notice"
            },
            "price": "29",
            "priceCurrency": "GBP"
          }
        ]
      }
    }
    </script>

    <!-- JSON-LD Structured Data - WebSite (for search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OneSimpleSite",
      "url": "https://onesimplesite.co.uk",
      "description": "Fixed-price website design for local UK businesses"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
