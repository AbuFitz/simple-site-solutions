<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>OneSimpleSite | Fixed-Price Websites for UK Local Businesses</title>
    <meta name="title" content="OneSimpleSite | Fixed-Price Websites for UK Local Businesses" />
    <meta name="description" content="Fixed-price websites for local UK businesses. Layouts planned for your kind of business. Plumbers, electricians, mechanics, cleaners & more. Fixed prices from £199." />
    <meta name="keywords" content="web design UK, local business website, small business website, affordable website design, plumber website, electrician website, tradesman website, UK web design, professional website, local SEO" />
    <meta name="author" content="OneSimpleSite" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#3BA875" />
    <meta name="msapplication-TileColor" content="#3BA875" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="One Simple Site - Professional Websites for Local UK Businesses" />
    <meta property="og:description" content="Fixed-price websites for local UK businesses. Layouts planned for your kind of business. Fixed prices from £199." />
    <meta property="og:image" content="https://onesimplesite.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="OneSimpleSite" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One Simple Site - Professional Websites for Local UK Businesses" />
    <meta name="twitter:description" content="Fixed-price websites for local UK businesses. Layouts planned for your kind of business. Fixed prices from £199." />
    <meta name="twitter:image" content="https://onesimplesite.co.uk/og-image.png" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="United Kingdom" />

    <!-- JSON-LD Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OneSimpleSite",
      "alternateName": "One Simple Site",
      "url": "https://onesimplesite.co.uk",
      "logo": "https://onesimplesite.co.uk/favicon.svg",
      "description": "Professional website design services for local UK businesses. Fixed-price websites with basic local SEO foundations.",
      "email": "hello@onesimplesite.co.uk",
      "areaServed": {
        "@type": "Country",
        "name": "United Kingdom"
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD Structured Data - LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "OneSimpleSite",
      "description": "Professional website design and development services for local UK businesses including plumbers, electricians, mechanics, cleaners, and tradespeople.",
      "url": "https://onesimplesite.co.uk",
      "logo": "https://onesimplesite.co.uk/favicon.svg",
      "image": "https://onesimplesite.co.uk/og-image.png",
      "email": "hello@onesimplesite.co.uk",
      "priceRange": "£199-£649",
      "areaServed": {
        "@type": "Country",
        "name": "United Kingdom"
      },
      "serviceType": ["Web Design", "Web Development", "Local SEO", "Website Hosting"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Website Packages",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "The Starter",
              "description": "Up to 3 pages, copywriting, mobile-first design, contact form and WhatsApp, Google Maps, basic SEO"
            },
            "price": "199",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "The Sorted",
              "description": "Up to 6 pages, everything in The Starter plus booking, trust signals and full on-page SEO"
            },
            "price": "399",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "The Works",
              "description": "Up to 10 pages, everything in The Sorted plus location pages, blog setup and analytics setup"
            },
            "price": "649",
            "priceCurrency": "GBP"
          }
        ]
      }
    }
    </script>

    <!-- JSON-LD Structured Data - WebSite (for search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OneSimpleSite",
      "url": "https://onesimplesite.co.uk",
      "description": "Fixed-price website design for local UK businesses"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
